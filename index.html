<!DOCTYPE html>
<html>
<body>

<h1>Kalkulačka</h1>

<input id="a">
<input id="b">
<button onclick="spocitat()">Sečíst</button>

<p id="vysledek"></p>

<script>
function spocitat() {
  let a = Number(document.getElementById("a").value);
  let b = Number(document.getElementById("b").value);
  document.getElementById("vysledek").innerText = a + b;
}
</script>

<button onclick="pozdrav()">Klikni</button>
<p id="text"></p>

</body>
</html>
